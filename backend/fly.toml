# fly.toml app configuration file generated for food-platform-backend on 2026-05-11T21:45:49+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# ─────────────────────────────────────────────────────────────────────────────
# Required Fly.io secrets (set via `fly secrets set KEY=value`):
#
#   DATABASE_URL          — postgresql+psycopg://... (Supabase Postgres; NOT in [env])
#   ADMIN_API_KEY         — random secret for /api/v1/admin/* endpoints
#   ALLOW_SQLITE_FALLBACK — set to "false" in production
#
# Do NOT scale to more than one machine without Postgres + connection pooling.
# SQLite volume mounts below are legacy; remove [[mounts]] after Supabase cutover.
# ─────────────────────────────────────────────────────────────────────────────

app = 'food-platform-backend'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8000'
  ALLOW_SQLITE_FALLBACK = 'false'
  # Production frontend origin — allows the Vercel app to call this API.
  CORS_ORIGINS = 'https://food-platform-one.vercel.app,http://localhost:5173,http://127.0.0.1:5173'

[[mounts]]
  source = 'food_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep one machine warm during migration; scrapes run in GitHub Actions against Supabase.
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "5s"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
