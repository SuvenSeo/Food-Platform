name: FoodLK — Unified Data Scraper

# ─────────────────────────────────────────────────────────────────────────────
# Runs every 6 hours (00:10, 06:10, 12:10, 18:10 Sri Lanka Standard Time).
# Can also be triggered manually via GitHub Actions → "Run workflow".
#
# Sources:
#   Retail  → spar2u, glomark, keells, cargills
#   Market  → wfp (WFP/HDX history), cbsl (Central Bank PDF), dcs (DCS Excel)
#
# How it works:
#   1. setup job resolves which sources to run into JSON arrays.
#   2. retail/market jobs use fromJSON() to build their matrices dynamically.
#      This avoids referencing `matrix` in a job-level `if`, which GitHub
#      Actions rejects at workflow_dispatch validation time.
#   3. Each job wakes the Fly.io backend, triggers the scraper via admin API,
#      waits for the background task, then verifies row counts.
#
# Required GitHub Actions secrets:
#   ADMIN_API_KEY  — must match the ADMIN_API_KEY set on Fly.io
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 00:10 SLT (UTC+5:30 → UTC 18:40 previous day)
    - cron: "40 18 * * *"
    # 06:10 SLT
    - cron: "40 0 * * *"
    # 12:10 SLT
    - cron: "40 6 * * *"
    # 18:10 SLT
    - cron: "40 12 * * *"

  workflow_dispatch:
    inputs:
      source:
        description: "Source to scrape — leave blank to run ALL sources"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - spar2u
          - glomark
          - keells
          - cargills
          - wfp
          - cbsl
          - dcs
      max_items:
        description: "Max offers per retail source (default 500)"
        required: false
        default: "500"

env:
  BACKEND: "https://food-platform-backend.fly.dev"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Resolve which sources to run. Outputs two JSON arrays (retail, market) that
  # the downstream jobs consume via fromJSON(). This avoids any reference to
  # the matrix context inside a job-level `if`, which GitHub forbids.
  # ─────────────────────────────────────────────────────────────────────────────
  setup:
    name: "Resolve source matrix"
    runs-on: ubuntu-latest
    outputs:
      retail: ${{ steps.matrix.outputs.retail }}
      market: ${{ steps.matrix.outputs.market }}
    steps:
      - name: Compute matrices
        id: matrix
        run: |
          SOURCE="${{ github.event.inputs.source }}"

          if [ -z "$SOURCE" ]; then
            # No filter — run all sources
            echo 'retail=["spar2u","glomark","keells","cargills"]' >> "$GITHUB_OUTPUT"
            echo 'market=["wfp","cbsl","dcs"]'                     >> "$GITHUB_OUTPUT"
          elif [[ "$SOURCE" == spar2u || "$SOURCE" == glomark || "$SOURCE" == keells || "$SOURCE" == cargills ]]; then
            echo "retail=[\"$SOURCE\"]" >> "$GITHUB_OUTPUT"
            echo 'market=[]'           >> "$GITHUB_OUTPUT"
          elif [[ "$SOURCE" == wfp || "$SOURCE" == cbsl || "$SOURCE" == dcs ]]; then
            echo 'retail=[]'           >> "$GITHUB_OUTPUT"
            echo "market=[\"$SOURCE\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'retail=[]' >> "$GITHUB_OUTPUT"
            echo 'market=[]' >> "$GITHUB_OUTPUT"
          fi

          echo "Retail sources : $(grep retail $GITHUB_OUTPUT | tail -1)"
          echo "Market sources : $(grep market $GITHUB_OUTPUT | tail -1)"

  # ─────────────────────────────────────────────────────────────────────────────
  # Retail sources — Spar2u, Glomark, Keells, Cargills
  # ─────────────────────────────────────────────────────────────────────────────
  retail:
    name: "Retail — ${{ matrix.source }}"
    needs: setup
    # Skip entirely if the setup job resolved an empty retail list.
    # Uses needs context (always available at job level) — no matrix context needed.
    if: ${{ needs.setup.outputs.retail != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.setup.outputs.retail) }}

    steps:
      - name: Wake backend (Fly.io cold start can take ~30 s)
        run: |
          echo "Waking up $BACKEND ..."
          for i in 1 2 3 4 5 6; do
            HTTP=$(curl -o /dev/null -sw "%{http_code}" "$BACKEND/health" 2>/dev/null || echo "000")
            echo "  attempt $i → HTTP $HTTP"
            [ "$HTTP" = "200" ] && { echo "Backend is up."; break; }
            sleep 10
          done

      - name: Trigger ${{ matrix.source }} scrape
        run: |
          echo "POSTing to admin trigger/sync for ${{ matrix.source }} ..."
          RESP=$(curl -sf \
            -X POST "$BACKEND/api/v1/admin/trigger/sync?sources=${{ matrix.source }}&max_items=${{ github.event.inputs.max_items || '500' }}" \
            -H "X-Admin-Key: ${{ secrets.ADMIN_API_KEY }}")
          echo "Response: $RESP"
          [ -n "$RESP" ] || { echo "ERROR: empty response from trigger endpoint"; exit 1; }

      - name: Wait for scrape to complete (~3 min for 500 items)
        run: |
          echo "Sleeping 180 s to let the scraper finish..."
          sleep 180

      - name: Verify — check admin status
        run: |
          echo "Fetching admin status..."
          STATUS=$(curl -sf \
            "$BACKEND/api/v1/admin/status" \
            -H "X-Admin-Key: ${{ secrets.ADMIN_API_KEY }}")
          echo "Admin status: $STATUS"
          OFFERS=$(echo "$STATUS" | python3 -c \
            "import sys,json; print(json.load(sys.stdin).get('retail_offers', 0))")
          echo "Total retail offers in DB: $OFFERS"
          if [ "$OFFERS" -gt "0" ]; then
            echo "✅ Live data confirmed — $OFFERS retail offers in production DB."
          else
            echo "⚠️  Warning: DB shows 0 retail offers after scrape."
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Official market data — WFP, CBSL, DCS
  # ─────────────────────────────────────────────────────────────────────────────
  market:
    name: "Market — ${{ matrix.source }}"
    needs: setup
    if: ${{ needs.setup.outputs.market != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.setup.outputs.market) }}

    steps:
      - name: Wake backend (Fly.io cold start can take ~30 s)
        run: |
          echo "Waking up $BACKEND ..."
          for i in 1 2 3 4 5 6; do
            HTTP=$(curl -o /dev/null -sw "%{http_code}" "$BACKEND/health" 2>/dev/null || echo "000")
            echo "  attempt $i → HTTP $HTTP"
            [ "$HTTP" = "200" ] && { echo "Backend is up."; break; }
            sleep 10
          done

      - name: Trigger ${{ matrix.source }} market scrape
        run: |
          echo "POSTing to admin trigger/market-sync for ${{ matrix.source }} ..."
          RESP=$(curl -sf \
            -X POST "$BACKEND/api/v1/admin/trigger/market-sync?sources=${{ matrix.source }}" \
            -H "X-Admin-Key: ${{ secrets.ADMIN_API_KEY }}")
          echo "Response: $RESP"
          [ -n "$RESP" ] || { echo "ERROR: empty response from trigger endpoint"; exit 1; }

      - name: Wait for market scrape to complete (~2 min)
        run: |
          echo "Sleeping 120 s to let the market scraper finish..."
          sleep 120

      - name: Verify — check admin status
        run: |
          echo "Fetching admin status..."
          STATUS=$(curl -sf \
            "$BACKEND/api/v1/admin/status" \
            -H "X-Admin-Key: ${{ secrets.ADMIN_API_KEY }}")
          echo "Admin status: $STATUS"
          QUOTES=$(echo "$STATUS" | python3 -c \
            "import sys,json; print(json.load(sys.stdin).get('market_quotes', 0))")
          echo "Total market quotes in DB: $QUOTES"
          if [ "$QUOTES" -gt "0" ]; then
            echo "✅ Live data confirmed — $QUOTES market quotes in production DB."
          else
            echo "⚠️  Warning: DB shows 0 market quotes after scrape."
          fi
