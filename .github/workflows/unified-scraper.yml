name: FoodLK — Unified Data Scraper

# ─────────────────────────────────────────────────────────────────────────────
# Runs production-safe sources every 6 hours (00:10, 06:10, 12:10, 18:10 Sri Lanka Standard Time).
# Can also be triggered manually via GitHub Actions → "Run workflow".
#
# Retail scrapers run directly in CI against DATABASE_URL (Supabase Postgres).
# Market sources run via run_official_market_sync.py in CI.
#
# Required GitHub Actions secrets:
#   DATABASE_URL   — postgresql+psycopg://... (Supabase)
#   ADMIN_API_KEY  — optional; retained for manual Fly admin triggers
#
# If DATABASE_URL uses db.<project>.supabase.co, CI rewrites it to the IPv4
# transaction pooler URL before running sync commands.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "40 18 * * *"
    - cron: "40 0 * * *"
    - cron: "40 6 * * *"
    - cron: "40 12 * * *"

  workflow_dispatch:
    inputs:
      source:
        description: "Source to scrape — leave blank to run ALL sources"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - spar2u
          - glomark
          - keells
          - cargills
          - wfp
          - cbsl
          - dcs
          - doa
      max_items:
        description: "Max offers per retail source (default 500)"
        required: false
        default: "500"

env:
  PYTHON_VERSION: "3.12"

jobs:
  setup:
    name: "Resolve source matrix"
    runs-on: ubuntu-latest
    outputs:
      retail: ${{ steps.matrix.outputs.retail }}
      market: ${{ steps.matrix.outputs.market }}
    steps:
      - name: Compute matrices
        id: matrix
        run: |
          SOURCE="${{ github.event.inputs.source }}"

          if [ -z "$SOURCE" ]; then
            echo 'retail=["spar2u","glomark","keells","cargills"]' >> "$GITHUB_OUTPUT"
            echo 'market=["wfp","cbsl","dcs","doa"]' >> "$GITHUB_OUTPUT"
          elif [[ "$SOURCE" == spar2u || "$SOURCE" == glomark || "$SOURCE" == keells || "$SOURCE" == cargills ]]; then
            echo "retail=[\"$SOURCE\"]" >> "$GITHUB_OUTPUT"
            echo 'market=[]'           >> "$GITHUB_OUTPUT"
          elif [[ "$SOURCE" == wfp || "$SOURCE" == cbsl || "$SOURCE" == dcs || "$SOURCE" == doa ]]; then
            echo 'retail=[]'           >> "$GITHUB_OUTPUT"
            echo "market=[\"$SOURCE\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'retail=[]' >> "$GITHUB_OUTPUT"
            echo 'market=[]' >> "$GITHUB_OUTPUT"
          fi

  retail:
    name: "Retail — ${{ matrix.source }}"
    needs: setup
    if: ${{ needs.setup.outputs.retail != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.setup.outputs.retail) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies and Chromium
        working-directory: backend
        run: |
          pip install -r requirements.txt
          playwright install chromium chromium-headless-shell --with-deps

      - name: Resolve database URL for GitHub runner
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/resolve_github_database_url.py >> "$GITHUB_ENV"

      - name: Run ${{ matrix.source }} scrape
        working-directory: backend
        env:
          ALLOW_SQLITE_FALLBACK: "false"
          APP_ENV: production
        run: |
          python run_sync.py --sources ${{ matrix.source }} --max-items ${{ github.event.inputs.max_items || '500' }}

      - name: Verify scrape run
        working-directory: backend
        env:
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          python scripts/verify_last_scrape.py --source ${{ matrix.source }} --max-wait-seconds 30

  market:
    name: "Market — ${{ matrix.source }}"
    needs: setup
    if: ${{ needs.setup.outputs.market != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.setup.outputs.market) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Resolve database URL for GitHub runner
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/resolve_github_database_url.py >> "$GITHUB_ENV"

      - name: Run ${{ matrix.source }} official market sync
        working-directory: backend
        env:
          ALLOW_SQLITE_FALLBACK: "false"
          APP_ENV: production
        run: python run_official_market_sync.py --sources ${{ matrix.source }}

      - name: Verify ${{ matrix.source }} market rows
        working-directory: backend
        env:
          ALLOW_SQLITE_FALLBACK: "false"
          APP_ENV: production
        run: python scripts/verify_market_source.py --source ${{ matrix.source }} --min-rows 1
