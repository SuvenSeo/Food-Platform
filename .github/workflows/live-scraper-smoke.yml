name: FoodLK — Live Scraper Smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    name: Live scraper nonzero checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Install browser runtime for retail sources
        run: playwright install chromium chromium-headless-shell --with-deps
      - name: Verify all live scrapers return rows
        run: python test_scrapers_live.py
