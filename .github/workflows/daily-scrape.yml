name: Food Platform Data Sync

on:
  schedule:
    # Retail prices: every 6 hours (Shopify stores update frequently)
    - cron: "0 0,6,12,18 * * *"
    # Official market data: once daily at 03:00 UTC (after DCS/CBSL publish)
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - retail
          - market-official
          - market-json
      source:
        description: "Specific retail source (leave blank for all)"
        required: false
        default: ""
      max_items:
        description: "Item cap per retail source"
        required: false
        default: "500"

# ─────────────────────────────────────────────
# Retail scraping — Spar2u, Glomark, Keells, Cargills
# ─────────────────────────────────────────────
jobs:
  retail-scrape:
    name: Retail — ${{ matrix.source }}
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'retail'
    strategy:
      fail-fast: false
      matrix:
        source: [spar2u, glomark, keells, cargills]
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      SCRAPER_USER_AGENT: "Mozilla/5.0 (compatible; FoodLensBot/1.0; +https://food-platform-one.vercel.app)"
      SCRAPE_MAX_ITEMS_PER_SOURCE: ${{ github.event.inputs.max_items || vars.SCRAPE_MAX_ITEMS_PER_SOURCE || '500' }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS || 'http://localhost:5173' }}
      ALLOW_SQLITE_FALLBACK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply migrations
        run: python -c "from app.db.migrate import run_upgrade; run_upgrade()"
      - name: Skip if specific source requested and not this one
        if: github.event.inputs.source != '' && github.event.inputs.source != matrix.source
        run: echo "Skipping ${{ matrix.source }} — only ${{ github.event.inputs.source }} requested." && exit 0
      - name: Sync ${{ matrix.source }}
        run: |
          python run_sync.py \
            --sources "${{ matrix.source }}" \
            --max-items "${{ github.event.inputs.max_items || vars.SCRAPE_MAX_ITEMS_PER_SOURCE || '500' }}"

  # ─────────────────────────────────────────────
  # Official market data — WFP, DCS, CBSL
  # ─────────────────────────────────────────────
  market-official:
    name: Market data — official sources (WFP/DCS/CBSL)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'market-official'
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      APP_ENV: production
      ALLOW_SQLITE_FALLBACK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply migrations
        run: python -c "from app.db.migrate import run_upgrade; run_upgrade()"
      - name: Sync WFP market data
        run: python run_official_market_sync.py --sources wfp
        continue-on-error: true
      - name: Sync DCS weekly retail prices
        run: python run_official_market_sync.py --sources dcs
        continue-on-error: true
      - name: Sync CBSL daily price report
        run: python run_official_market_sync.py --sources cbsl
        continue-on-error: true

  # ─────────────────────────────────────────────
  # Legacy JSON market quotes (custom URL or seed)
  # ─────────────────────────────────────────────
  market-json:
    name: Market data — JSON feed
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'schedule' || github.event.inputs.job == 'all' || github.event.inputs.job == 'market-json') &&
      secrets.MARKET_QUOTES_URL != ''
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      APP_ENV: production
      ALLOW_SQLITE_FALLBACK: "false"
      MARKET_QUOTES_URL: ${{ secrets.MARKET_QUOTES_URL }}
      MARKET_QUOTES_TIMEOUT_SECONDS: ${{ vars.MARKET_QUOTES_TIMEOUT_SECONDS || '20' }}
      MARKET_QUOTES_FORMAT: ${{ vars.MARKET_QUOTES_FORMAT || 'json' }}
      MARKET_QUOTES_SEED_FALLBACK_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply migrations
        run: python -c "from app.db.migrate import run_upgrade; run_upgrade()"
      - name: Validate URL
        run: python -c "import os,sys; url=os.getenv('MARKET_QUOTES_URL','').strip(); sys.exit(0 if url else 1)"
      - name: Sync market quotes from URL
        run: python run_market_sync.py
